<aside class="w-60 shrink-0 border-r border-gray-100 bg-white flex flex-col h-screen sticky top-0">
  <!-- Logo -->
  <div class="px-5 py-5 border-b border-gray-100">
    <a href="/admin/" class="flex items-center gap-2.5">
      <div class="w-7 h-7 bg-gray-900 rounded-lg flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
        </svg>
      </div>
      <span class="text-sm font-semibold text-gray-900 tracking-tight">BTS Shuttle</span>
    </a>
  </div>

  <!-- Nav -->
  <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
    <p class="px-3 mb-2 text-xs font-medium text-gray-400 uppercase tracking-wider">總覽</p>

    <a href="/admin/"
       class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
              {% if request.path == '/admin/' %}text-gray-900 bg-gray-100{% else %}text-gray-500 hover:text-gray-900 hover:bg-gray-100{% endif %}">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      Dashboard
    </a>

    <p class="px-3 mt-5 mb-2 text-xs font-medium text-gray-400 uppercase tracking-wider">管理</p>

    <a href="/admin/orders"
       class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
              {% if '/admin/orders' in request.path %}text-gray-900 bg-gray-100{% else %}text-gray-500 hover:text-gray-900 hover:bg-gray-100{% endif %}">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      訂單管理
    </a>

    <a href="/admin/vehicles"
       class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
              {% if '/admin/vehicles' in request.path %}text-gray-900 bg-gray-100{% else %}text-gray-500 hover:text-gray-900 hover:bg-gray-100{% endif %}">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4M6 20v-2a4 4 0 014-4h4a4 4 0 014 4v2"/>
      </svg>
      車輛管理
    </a>

    <a href="/admin/drivers"
       class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
              {% if '/admin/drivers' in request.path %}text-gray-900 bg-gray-100{% else %}text-gray-500 hover:text-gray-900 hover:bg-gray-100{% endif %}">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      司機管理
    </a>

    <a href="/admin/payments"
       class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
              {% if '/admin/payments' in request.path %}text-gray-900 bg-gray-100{% else %}text-gray-500 hover:text-gray-900 hover:bg-gray-100{% endif %}">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
      </svg>
      付款管理
    </a>

    <a href="/admin/admins"
       class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
              {% if '/admin/admins' in request.path %}text-gray-900 bg-gray-100{% else %}text-gray-500 hover:text-gray-900 hover:bg-gray-100{% endif %}">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      帳號管理
    </a>

    <p class="px-3 mt-5 mb-2 text-xs font-medium text-gray-400 uppercase tracking-wider">排車</p>

    <a href="/admin/dispatch"
       class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
              {% if '/admin/dispatch' in request.path %}text-gray-900 bg-gray-100{% else %}text-gray-500 hover:text-gray-900 hover:bg-gray-100{% endif %}">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10l2.67-2.67A2 2 0 017.08 13H13zm0 0h2l3-5h-3a1 1 0 00-1 1v4z"/>
      </svg>
      排車管理
    </a>
  </nav>

  <!-- Footer -->
  <div class="px-3 py-4 border-t border-gray-100">
    <a href="/admin/logout"
       class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-gray-900 hover:bg-gray-100 transition-colors">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      登出
    </a>
  </div>
</aside>
