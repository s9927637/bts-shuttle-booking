<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>版面比較 — BTS Shuttle</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
    iframe { border: none; width: 100%; height: 100%; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

  <!-- Top bar -->
  <div class="bg-white border-b border-gray-200 px-6 h-12 flex items-center justify-between shrink-0">
    <span class="text-sm font-semibold text-gray-900">版面比較</span>
    <div class="flex items-center gap-4">
      <span class="text-xs text-gray-400">左：舊版 &nbsp;｜&nbsp; 右：新版</span>
      <a href="/" class="text-xs font-medium text-gray-500 hover:text-gray-900 transition-colors">前往新版 →</a>
    </div>
  </div>

  <!-- Split view -->
  <div class="flex flex-1 overflow-hidden gap-px bg-gray-200">

    <!-- Left: Old -->
    <div class="flex flex-col flex-1 overflow-hidden bg-white">
      <div class="px-4 py-2 bg-gray-50 border-b border-gray-200 flex items-center gap-2 shrink-0">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-200 text-gray-600">舊版</span>
        <span class="text-xs text-gray-400">簡單置中 Hero</span>
      </div>
      <iframe src="/home-old" title="舊版首頁"></iframe>
    </div>

    <!-- Right: New -->
    <div class="flex flex-col flex-1 overflow-hidden bg-white">
      <div class="px-4 py-2 bg-gray-50 border-b border-gray-200 flex items-center gap-2 shrink-0">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-900 text-white">新版</span>
        <span class="text-xs text-gray-400">完整 Landing Page</span>
      </div>
      <iframe src="/" title="新版首頁"></iframe>
    </div>

  </div>

</body>
</html>
