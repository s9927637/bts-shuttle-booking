<style>
  /* ── Collapsed state ─────────────────────────── */
  #sidebar.collapsed {
    width: 72px !important;
  }
  /* Hide text elements */
  #sidebar.collapsed .sidebar-text {
    opacity: 0 !important;
    max-width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  /* Centre icons when collapsed */
  #sidebar.collapsed .sidebar-link {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
  }
  /* Hide category labels entirely (they'd show a blank row) */
  #sidebar.collapsed .sidebar-cat {
    height: 0;
    overflow: hidden;
    margin: 0 !important;
    padding: 0 !important;
  }
</style>

<script>
  (function () {
    var sidebar      = document.getElementById('sidebar');
    var iconCollapse = document.getElementById('sidebar-icon-collapse');
    var iconExpand   = document.getElementById('sidebar-icon-expand');
    var toggleBtn    = document.getElementById('sidebar-toggle');

    var STORAGE_KEY = 'bts_sidebar_collapsed';
    var isMobile    = window.innerWidth < 768;

    // Read saved state; on mobile default to collapsed
    var savedCollapsed = localStorage.getItem(STORAGE_KEY);
    var startCollapsed = (savedCollapsed !== null)
      ? savedCollapsed === 'true'
      : isMobile;

    function applyState(collapsed, animate) {
      if (!animate) {
        // Disable transition for instant apply on page load
        sidebar.style.transition = 'none';
        requestAnimationFrame(function () {
          sidebar.style.transition = 'width 300ms ease-in-out';
        });
      }
      if (collapsed) {
        sidebar.classList.add('collapsed');
        iconCollapse.classList.add('hidden');
        iconExpand.classList.remove('hidden');
        toggleBtn.setAttribute('title', '展開側欄');
      } else {
        sidebar.classList.remove('collapsed');
        iconCollapse.classList.remove('hidden');
        iconExpand.classList.add('hidden');
        toggleBtn.setAttribute('title', '收合側欄');
      }
      localStorage.setItem(STORAGE_KEY, String(collapsed));
    }

    // Apply initial state without animation
    applyState(startCollapsed, false);

    // Toggle on button click
    window.sidebarToggle = function () {
      var nowCollapsed = sidebar.classList.contains('collapsed');
      applyState(!nowCollapsed, true);
    };
  })();
</script>
