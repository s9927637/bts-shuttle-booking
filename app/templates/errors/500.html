{% extends "layouts/base.html" %}
{% block title %}系統發生錯誤{% endblock %}
{% block content %}
<div class="page-container flex flex-col items-center justify-center min-h-[60vh] text-center">
  <div class="w-16 h-16 rounded-2xl bg-red-900/30 flex items-center justify-center mb-6">
    <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
    </svg>
  </div>
  <h1 class="text-xl font-bold text-white mb-2">系統發生錯誤</h1>
  <p class="text-sm text-gray-400 mb-6">操作無法完成，請稍後再試。<br>若問題持續發生，請聯絡系統管理員。</p>
  <a href="/" class="px-6 py-2.5 bg-gray-800 text-white text-sm font-medium rounded-xl hover:bg-gray-700 transition-colors">
    返回首頁
  </a>
</div>
{% endblock %}
