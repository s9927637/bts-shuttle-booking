<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINE 帳號綁定 — 包車預約系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-10">

<div class="w-full max-w-sm">

  <!-- 標題 -->
  <div class="text-center mb-8">
    <div class="inline-flex w-14 h-14 bg-gray-900 rounded-2xl items-center justify-center mb-4">
      <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
      </svg>
    </div>
    <h1 class="text-xl font-bold text-gray-900">LINE 帳號綁定</h1>
    <p class="mt-1 text-sm text-gray-500">綁定後可透過 LINE 接收派車通知</p>
  </div>

  <!-- 狀態卡片 -->
  <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">

    <!-- 載入中 -->
    <div id="state-loading" class="px-6 py-10 text-center">
      <div class="flex items-center justify-center gap-2 text-sm text-gray-400">
        <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
        正在取得 LINE 身份…
      </div>
    </div>

    <!-- 輸入電話表單 -->
    <div id="state-form" class="hidden px-6 py-6 space-y-5">

      <!-- LINE 身份資訊 -->
      <div id="line-identity" class="hidden flex items-center gap-3 px-4 py-3 bg-green-50 border border-green-100 rounded-xl">
        <img id="line-avatar" src="" alt="" class="hidden w-10 h-10 rounded-full object-cover" />
        <div>
          <p id="line-name-text" class="text-sm font-semibold text-green-800"></p>
          <p class="text-xs text-green-600">LINE 身份驗證成功</p>
        </div>
      </div>

      <div>
        <p class="text-sm font-semibold text-gray-900 mb-1">輸入您的手機號碼</p>
        <p class="text-xs text-gray-400">請輸入訂票時填寫的手機號碼，系統將自動為您的訂單完成 LINE 綁定。</p>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1.5">
          手機號碼 <span class="text-red-400">*</span>
        </label>
        <input id="input-phone" type="tel" inputmode="numeric" placeholder="0912-345-678"
               class="w-full px-4 py-2.5 text-sm bg-white border border-gray-200 rounded-xl text-gray-900
                      placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent" />
      </div>

      <button id="btn-bind" type="button"
              class="w-full py-3 bg-gray-900 text-white text-sm font-semibold rounded-xl
                     hover:bg-gray-700 active:bg-gray-800 transition-colors">
        完成綁定
      </button>

      <div id="bind-error" class="hidden text-xs text-red-500 text-center px-2"></div>
    </div>

    <!-- 成功 -->
    <div id="state-success" class="hidden px-6 py-8 text-center space-y-3">
      <div class="w-14 h-14 bg-green-50 rounded-2xl flex items-center justify-center mx-auto">
        <svg class="w-7 h-7 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <p class="text-base font-semibold text-gray-900">綁定成功！</p>
      <p id="success-detail" class="text-sm text-gray-500"></p>
      <p class="text-xs text-gray-400 pt-1">派車通知將自動傳送到此 LINE 帳號。<br>無需再次操作，可以關閉此頁面。</p>
    </div>

    <!-- 已綁定 -->
    <div id="state-already" class="hidden px-6 py-8 text-center space-y-3">
      <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto">
        <svg class="w-7 h-7 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <p class="text-base font-semibold text-gray-900">已完成綁定</p>
      <p class="text-sm text-gray-500">您的訂單已綁定此 LINE 帳號，<br>無需重複操作。</p>
    </div>

    <!-- 未在 LINE 內開啟 -->
    <div id="state-no-line" class="hidden px-6 py-8 text-center space-y-3">
      <div class="w-14 h-14 bg-amber-50 rounded-2xl flex items-center justify-center mx-auto">
        <svg class="w-7 h-7 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
      <p class="text-sm font-semibold text-gray-900">請透過 LINE 開啟此頁面</p>
      <p class="text-xs text-gray-400">此頁面需在 LINE 應用程式內開啟，<br>才能完成帳號綁定。</p>
    </div>

  </div>

  <p class="mt-6 text-center text-xs text-gray-300">© 包車預約系統</p>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID  = "{{ passenger_liff_id }}";
const BIND_URL = "/api/line-bind";

let lineUserId  = null;
let displayName = null;

function show(id) {
  ["state-loading", "state-form", "state-success", "state-already", "state-no-line"]
    .forEach(s => document.getElementById(s).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

if (!LIFF_ID) {
  show("state-no-line");
} else {
  liff.init({ liffId: LIFF_ID })
    .then(() => {
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      return liff.getProfile().then(profile => {
        lineUserId  = profile.userId;
        displayName = profile.displayName;

        // 顯示 LINE 身份
        const el = document.getElementById("line-name-text");
        el.textContent = displayName;
        document.getElementById("line-identity").classList.remove("hidden");
        if (profile.pictureUrl) {
          const img = document.getElementById("line-avatar");
          img.src = profile.pictureUrl;
          img.classList.remove("hidden");
        }
        show("state-form");
      });
    })
    .catch(() => show("state-no-line"));
}

document.getElementById("btn-bind").addEventListener("click", async () => {
  const phone = document.getElementById("input-phone").value.trim();
  if (!phone) {
    showError("請輸入手機號碼");
    return;
  }

  const btn = document.getElementById("btn-bind");
  btn.disabled = true;
  btn.textContent = "綁定中…";
  clearError();

  try {
    const res  = await fetch(BIND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ line_user_id: lineUserId, display_name: displayName, phone }),
    });
    const data = await res.json();

    if (!data.ok) {
      showError(data.error || "綁定失敗，請稍後再試。");
      btn.disabled = false;
      btn.textContent = "完成綁定";
      return;
    }

    if (data.updated === 0) {
      show("state-already");
    } else {
      document.getElementById("success-detail").textContent =
        `已為 ${data.updated} 筆訂單完成綁定。`;
      show("state-success");
    }
  } catch {
    showError("網路錯誤，請稍後再試。");
    btn.disabled = false;
    btn.textContent = "完成綁定";
  }
});

function showError(msg) {
  const el = document.getElementById("bind-error");
  el.textContent = msg;
  el.classList.remove("hidden");
}
function clearError() {
  document.getElementById("bind-error").classList.add("hidden");
}
</script>

</body>
</html>
