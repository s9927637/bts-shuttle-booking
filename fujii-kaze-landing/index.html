<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藤井風 高雄演唱會來回包車專案｜KAZE Shuttle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <span class="logo-mark">風</span>
      <span class="logo-text">
        <span class="logo-title">KAZE</span>
        <span class="logo-sub">Shuttle</span>
      </span>
    </div>
  </header>

  <main class="hero">
    <div class="hero-content">
      <h1 class="event-title">藤井風</h1>
      <p class="event-subtitle">高雄演唱會來回包車專案</p>
      <p class="event-subtitle-en">Fujii Kaze Prema World Tour</p>

      <div class="divider"></div>

      <p class="route">台北　⇄　高雄</p>
      <p class="route-note">舒適直達・安心返程</p>

      <ul class="info-list">
        <li>
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15.5" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <path d="M3.5 9.5H20.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 3V6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M16 3V6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span>2026.10.31（六）</span>
        </li>
        <li>
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 21.5C12 21.5 19 15.192 19 9.9C19 5.813 15.866 2.5 12 2.5C8.13401 2.5 5 5.813 5 9.9C5 15.192 12 21.5 12 21.5Z" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="12" cy="9.7" r="2.4" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span>高雄國家體育場（世運主場館）</span>
        </li>
      </ul>

      <p class="price">
        <span class="price-currency">NT$</span>
        <span class="price-amount">2,000</span>
        <span class="price-unit">/ 人</span>
      </p>

      <div class="cta-group">
        <a href="#booking" class="btn btn-primary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="4.5" width="18" height="12" rx="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M3 10.5H21" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 20V16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M17 20V16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="7.5" cy="13.5" r="0.9" fill="currentColor"/>
            <circle cx="16.5" cy="13.5" r="0.9" fill="currentColor"/>
          </svg>
          立即預約
        </a>
        <a href="#pickup-info" class="btn btn-secondary">
          查看搭車資訊
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>
  </main>

</body>
</html>
