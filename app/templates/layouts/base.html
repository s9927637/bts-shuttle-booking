<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}BTS Shuttle{% endblock %}</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
  </style>
</head>
<body class="bg-white text-gray-900 antialiased min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="border-b border-gray-100 bg-white sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-7 h-7 bg-gray-900 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
          </svg>
        </div>
        <span class="text-sm font-semibold tracking-tight">BTS 演唱會包車預約</span>
      </a>

      <!-- Desktop links -->
      <div class="hidden md:flex items-center gap-1">
        <a href="/booking" class="px-3 py-1.5 text-sm font-medium rounded-lg
          {% if '/book' in request.path %}text-gray-900 bg-gray-100{% else %}text-gray-500 hover:text-gray-900 hover:bg-gray-100{% endif %} transition-colors">
          預約
        </a>
        <a href="/announcements" class="px-3 py-1.5 text-sm font-medium rounded-lg
          {% if '/announcements' in request.path %}text-gray-900 bg-gray-100{% else %}text-gray-500 hover:text-gray-900 hover:bg-gray-100{% endif %} transition-colors">
          最新公告
        </a>
        <a href="/orders/search" class="px-3 py-1.5 text-sm font-medium rounded-lg
          {% if '/orders/lookup' in request.path %}text-gray-900 bg-gray-100{% else %}text-gray-500 hover:text-gray-900 hover:bg-gray-100{% endif %} transition-colors">
          查詢訂單
        </a>
        <a href="/payment/report" class="px-3 py-1.5 text-sm font-medium rounded-lg
          {% if '/payment' in request.path %}text-gray-900 bg-gray-100{% else %}text-gray-500 hover:text-gray-900 hover:bg-gray-100{% endif %} transition-colors">
          匯款回報
        </a>
      </div>

      <!-- Mobile hamburger -->
      <button data-collapse-toggle="mobile-menu" type="button"
              class="md:hidden p-2 rounded-lg text-gray-500 hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-gray-100 bg-white">
      <div class="px-4 py-3 space-y-1">
        <a href="/booking" class="block px-3 py-2 text-sm font-medium rounded-lg text-gray-700 hover:bg-gray-100 transition-colors">預約</a>
        <a href="/announcements" class="block px-3 py-2 text-sm font-medium rounded-lg text-gray-700 hover:bg-gray-100 transition-colors">最新公告</a>
        <a href="/orders/search" class="block px-3 py-2 text-sm font-medium rounded-lg text-gray-700 hover:bg-gray-100 transition-colors">查詢訂單</a>
        <a href="/payment/report" class="block px-3 py-2 text-sm font-medium rounded-lg text-gray-700 hover:bg-gray-100 transition-colors">匯款回報</a>
      </div>
    </div>
  </nav>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="max-w-5xl mx-auto w-full px-6 pt-4">
      {% for category, message in messages %}
      <div class="flex items-start gap-3 p-4 rounded-xl border mb-3
        {% if category == 'error' %}bg-red-50 border-red-200 text-red-800
        {% else %}bg-green-50 border-green-200 text-green-800{% endif %}" role="alert">
        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
        </svg>
        <span class="text-sm font-medium">{{ message }}</span>
      </div>
      {% endfor %}
    </div>
    {% endif %}
  {% endwith %}

  <!-- Page content -->
  <main class="flex-1" style="padding-top: 3rem; padding-bottom: 4rem;">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-100 bg-white">
    <div class="max-w-5xl mx-auto px-6 py-8">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2.5">
          <div class="w-6 h-6 bg-gray-900 rounded-lg flex items-center justify-center">
            <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
            </svg>
          </div>
          <span class="text-xs font-semibold text-gray-500 tracking-tight">BTS 演唱會包車預約</span>
        </div>
        <div class="flex items-center gap-5">
          <a href="/announcements" class="text-xs text-gray-400 hover:text-gray-900 transition-colors">公告中心</a>
          <a href="/booking" class="text-xs text-gray-400 hover:text-gray-900 transition-colors">立即預約</a>
          <a href="/orders/search" class="text-xs text-gray-400 hover:text-gray-900 transition-colors">查詢訂單</a>
          <a href="/payment/report" class="text-xs text-gray-400 hover:text-gray-900 transition-colors">匯款回報</a>
        </div>
      </div>
    </div>
  </footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</body>
</html>
