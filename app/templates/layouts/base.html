<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}BTS Shuttle{% endblock %}</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }

    /* ── Dark background — force black regardless of Tailwind CDN coverage ── */
    html, body { background-color: #000000 !important; color: #ffffff; }
    main { background-color: #000000; min-height: 100vh; }

    /* ── Typography: all gray/slate text → white on dark background ── */
    .text-gray-100, .text-gray-200, .text-gray-300, .text-gray-400, .text-gray-500,
    .text-gray-600, .text-gray-700, .text-gray-800, .text-gray-900,
    .text-slate-100, .text-slate-200, .text-slate-300, .text-slate-400, .text-slate-500,
    .text-slate-600, .text-slate-700 { color: #ffffff !important; }

    /* ── Placeholder: white at 50% opacity ── */
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.45) !important; }
    .input-dark::placeholder { color: rgba(255,255,255,0.45) !important; }

    /* ── Shared Theme Classes ── */
    .page-container {
      max-width: 42rem; margin: 0 auto; padding: 3rem 1.5rem 5rem;
    }
    .card-dark {
      background: #111827; border: 1px solid #1f2937; border-radius: 1rem; padding: 1.25rem;
    }
    .section-title {
      font-size: 0.875rem; font-weight: 600; color: #ffffff;
    }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      width: 100%; padding: 0.875rem 1.5rem; border-radius: 0.75rem;
      background: #9333ea; color: #ffffff; font-size: 0.875rem; font-weight: 600;
      transition: background 0.15s; border: none; cursor: pointer; text-decoration: none;
    }
    .btn-primary:hover { background: #7e22ce; color: #ffffff; }
    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      width: 100%; padding: 0.75rem 1.5rem; border-radius: 0.75rem;
      background: transparent; color: #c084fc; font-size: 0.875rem; font-weight: 600;
      border: 1px solid #9333ea; transition: background 0.15s; cursor: pointer; text-decoration: none;
    }
    .btn-secondary:hover { background: rgba(147,51,234,0.12); color: #c084fc; }
    .input-dark {
      width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem;
      background: #1f2937; border: 1px solid #374151; color: #ffffff;
      font-size: 0.875rem; outline: none;
    }
    .input-dark::placeholder { color: #6b7280; }
    .input-dark:focus { border-color: #9333ea; box-shadow: 0 0 0 2px rgba(147,51,234,0.25); }
    .row-divider { border-top: 1px solid #1f2937; padding-top: 0.625rem; margin-top: 0; }
    /* ── Navbar always black on non-home pages ── */
    body > nav { background-color: #000000 !important; }
    .nav-item { color: #9ca3af; }
    .nav-item:hover { color: #ffffff; background: rgba(147,51,234,0.15); }
    .nav-active { color: #ffffff !important; background: #9333ea !important; }
  </style>
</head>
<body class="bg-black text-white antialiased min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="sticky top-0 z-40 bg-black" style="background-color:#000000 !important; border-bottom:1px solid rgba(255,255,255,0.10);">
    <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-7 h-7 bg-purple-600 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
          </svg>
        </div>
        <span class="text-sm font-semibold tracking-tight text-white">BTS 演唱會包車預約</span>
      </a>

      <!-- Desktop links -->
      <div class="hidden md:flex items-center gap-1">
        <a href="/booking"
           class="px-3 py-1.5 text-sm font-medium rounded-lg transition-colors nav-item {% if '/book' in request.path %}nav-active{% endif %}">
          預約
        </a>
        <a href="/orders/search"
           class="px-3 py-1.5 text-sm font-medium rounded-lg transition-colors nav-item {% if '/orders' in request.path %}nav-active{% endif %}">
          查詢訂單
        </a>
        <a href="/payment/report"
           class="px-3 py-1.5 text-sm font-medium rounded-lg transition-colors nav-item {% if '/payment' in request.path %}nav-active{% endif %}">
          匯款回報
        </a>
        <a href="/announcements"
           class="px-3 py-1.5 text-sm font-medium rounded-lg transition-colors nav-item {% if '/announcements' in request.path %}nav-active{% endif %}">
          最新公告
        </a>
      </div>

      <!-- Mobile hamburger -->
      <button id="nav-toggle" type="button" aria-label="開啟選單"
              class="md:hidden p-2 rounded-lg text-gray-400 hover:bg-gray-800 transition-colors">
        <!-- Hamburger icon -->
        <svg id="icon-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <!-- Close icon -->
        <svg id="icon-close" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile menu overlay backdrop -->
  <div id="nav-backdrop" class="hidden fixed inset-0 z-30 md:hidden"
       style="background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);"
       onclick="closeNavMenu()"></div>

  <!-- Mobile menu panel (fixed, below navbar) -->
  <div id="mobile-menu"
       class="hidden fixed left-0 right-0 z-40 md:hidden"
       style="top:56px; background:#000000; border-bottom:1px solid rgba(255,255,255,0.10);">
    <div class="px-4 py-3 space-y-1">
      <a href="/booking"
         class="flex items-center gap-2 px-3 py-2.5 text-sm font-medium rounded-lg transition-colors
                {% if '/book' in request.path %}text-white bg-purple-600{% else %}text-gray-300 hover:bg-gray-900 hover:text-white{% endif %}">
        預約
      </a>
      <a href="/orders/search"
         class="flex items-center gap-2 px-3 py-2.5 text-sm font-medium rounded-lg transition-colors
                {% if '/orders' in request.path %}text-white bg-purple-600{% else %}text-gray-300 hover:bg-gray-900 hover:text-white{% endif %}">
        查詢訂單
      </a>
      <a href="/payment/report"
         class="flex items-center gap-2 px-3 py-2.5 text-sm font-medium rounded-lg transition-colors
                {% if '/payment' in request.path %}text-white bg-purple-600{% else %}text-gray-300 hover:bg-gray-900 hover:text-white{% endif %}">
        匯款回報
      </a>
      <a href="/announcements"
         class="flex items-center gap-2 px-3 py-2.5 text-sm font-medium rounded-lg transition-colors
                {% if '/announcements' in request.path %}text-white bg-purple-600{% else %}text-gray-300 hover:bg-gray-900 hover:text-white{% endif %}">
        最新公告
      </a>
    </div>
  </div>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="max-w-5xl mx-auto w-full px-6 pt-4">
      {% for category, message in messages %}
      <div class="flex items-start gap-3 p-4 rounded-xl border mb-3
        {% if category == 'error' %}bg-red-950 border-red-800 text-red-300
        {% else %}bg-green-950 border-green-800 text-green-300{% endif %}" role="alert">
        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
        </svg>
        <span class="text-sm font-medium">{{ message }}</span>
      </div>
      {% endfor %}
    </div>
    {% endif %}
  {% endwith %}

  <!-- Page content -->
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
<script>
  (function () {
    var toggle   = document.getElementById('nav-toggle');
    var menu     = document.getElementById('mobile-menu');
    var backdrop = document.getElementById('nav-backdrop');
    var iconOpen  = document.getElementById('icon-open');
    var iconClose = document.getElementById('icon-close');
    var isOpen   = false;

    function openNavMenu() {
      isOpen = true;
      menu.classList.remove('hidden');
      backdrop.classList.remove('hidden');
      iconOpen.classList.add('hidden');
      iconClose.classList.remove('hidden');
      toggle.setAttribute('aria-label', '關閉選單');
    }

    function closeNavMenu() {
      isOpen = false;
      menu.classList.add('hidden');
      backdrop.classList.add('hidden');
      iconOpen.classList.remove('hidden');
      iconClose.classList.add('hidden');
      toggle.setAttribute('aria-label', '開啟選單');
    }

    window.closeNavMenu = closeNavMenu;

    if (toggle) {
      toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        isOpen ? closeNavMenu() : openNavMenu();
      });
    }

    // Close on Escape key
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && isOpen) closeNavMenu();
    });
  })();
</script>
</body>
</html>
