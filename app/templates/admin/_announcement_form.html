<div>
  <label class="block text-xs font-medium text-gray-500 mb-1.5">標題 <span class="text-red-400">*</span></label>
  <input type="text" name="title" required maxlength="255"
         class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"/>
</div>

<div>
  <label class="block text-xs font-medium text-gray-500 mb-1.5">內容 <span class="text-red-400">*</span></label>
  <textarea name="content" required rows="5"
            class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-900 resize-none"></textarea>
</div>

<div class="grid grid-cols-2 gap-4">
  <div>
    <label class="block text-xs font-medium text-gray-500 mb-1.5">公告類型</label>
    <select name="announcement_type"
            class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-900">
      {% for t in announcement_types %}
      <option value="{{ t }}">{{ t }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-xs font-medium text-gray-500 mb-1.5">狀態</label>
    <select name="status"
            class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-900">
      {% for s in announcement_statuses %}
      <option value="{{ s }}">{{ s }}</option>
      {% endfor %}
    </select>
  </div>
</div>

<div class="flex items-center gap-6">
  <label class="flex items-center gap-2 cursor-pointer select-none">
    <input type="checkbox" name="is_pinned" class="w-4 h-4 rounded border-gray-300 text-gray-900 focus:ring-gray-900"/>
    <span class="text-sm text-gray-700">置頂顯示</span>
  </label>
  <label class="flex items-center gap-2 cursor-pointer select-none">
    <input type="checkbox" name="publish_to_line" onchange="toggleLineTarget(this, this.closest('form'))"
           class="w-4 h-4 rounded border-gray-300 text-gray-900 focus:ring-gray-900"/>
    <span class="text-sm text-gray-700">發布時推播 LINE</span>
  </label>
</div>

<div class="line-target-wrap hidden">
  <label class="block text-xs font-medium text-gray-500 mb-1.5">LINE 推播對象</label>
  <select name="line_target"
          class="w-full px-3 py-2.5 text-sm bg-white border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-900">
    {% for t in line_targets %}
    <option value="{{ t }}">{{ t }}</option>
    {% endfor %}
  </select>
</div>
