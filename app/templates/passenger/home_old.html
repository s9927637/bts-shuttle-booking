<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舊版首頁</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <style>* { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }</style>
</head>
<body class="bg-white text-gray-900 antialiased">

<nav class="border-b border-gray-100 bg-white">
  <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">
    <span class="text-sm font-semibold">BTS Shuttle</span>
    <div class="flex items-center gap-1 text-sm text-gray-500">
      <span class="px-3 py-1.5">首頁</span>
      <span class="px-3 py-1.5">預約</span>
      <span class="px-3 py-1.5">查詢訂單</span>
      <span class="px-3 py-1.5">匯款回報</span>
    </div>
  </div>
</nav>

<div class="flex items-center justify-center text-center px-6" style="height: calc(100vh - 56px);">
  <div class="max-w-2xl w-full">
    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-gray-100 text-xs font-medium text-gray-600 mb-6">
      <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
      現正開放預約
    </span>
    <h1 class="text-5xl font-bold tracking-tight text-gray-900 leading-tight mb-5">
      BTS 高雄<br>演唱會接駁
    </h1>
    <p class="text-base text-gray-500 max-w-sm mx-auto mb-6 leading-relaxed">
      專車接送，輕鬆抵達高雄演唱會現場。<br>填寫資料、完成匯款，即可確認座位。
    </p>
    <div class="inline-flex items-center gap-2 px-4 py-2 bg-gray-900 text-white rounded-full text-sm font-semibold mb-8">
      NT$2,000 / 人
    </div>
    <div class="flex justify-center">
      <span class="inline-flex items-center gap-2 px-8 py-3.5 bg-gray-900 text-white text-sm font-semibold rounded-xl">
        立即預約 →
      </span>
    </div>
  </div>
</div>

</body>
</html>
