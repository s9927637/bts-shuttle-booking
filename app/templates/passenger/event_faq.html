<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>常見問題 — {{ ep.title }}</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
           background: #060312; color: #fff; min-height: 100vh; }
    .ev-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: rgba(6,3,18,0.92);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .ev-mobile-panel {
      background: rgba(6,3,18,0.97);
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .page-content { max-width: 760px; margin: 0 auto; padding: 96px 20px 60px; }
    .page-back { display: inline-flex; align-items: center; gap: 6px;
                 color: rgba(255,255,255,0.5); font-size: 13px; text-decoration: none;
                 margin-bottom: 16px; transition: color 0.2s; }
    .page-back:hover { color: #fff; }
    .page-title { font-size: 28px; font-weight: 700; color: #fff; }
    .page-subtitle { margin-top: 6px; font-size: 14px; color: rgba(255,255,255,0.45); margin-bottom: 32px; }
    .faq-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .faq-question {
      width: 100%; background: none; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px; text-align: left; color: #fff;
    }
    .faq-q-text { font-size: 15px; font-weight: 600; line-height: 1.5; }
    .faq-icon { flex-shrink: 0; width: 20px; height: 20px; color: rgba(255,255,255,0.4);
                transition: transform 0.25s; }
    .faq-item.open .faq-icon { transform: rotate(180deg); }
    .faq-answer {
      max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
    }
    .faq-item.open .faq-answer { max-height: 600px; }
    .faq-answer-inner {
      padding: 0 22px 18px;
      font-size: 14px; color: rgba(255,255,255,0.65);
      line-height: 1.8; white-space: pre-line;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 14px;
    }
    .empty-state { text-align: center; padding: 80px 20px;
                   color: rgba(255,255,255,0.35); font-size: 15px; }
  </style>
</head>
<body>
<nav class="ev-nav">
  <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
    <a href="/events/{{ ep.slug }}" class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center"
           style="background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.18);">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
        </svg>
      </div>
      <span class="text-sm font-semibold text-white tracking-tight">{{ ep.artist_name }} Shuttle</span>
    </a>
    <div class="hidden md:flex items-center gap-1">
      <a href="/events/{{ ep.slug }}/booking"    class="px-3 py-1.5 text-sm font-medium rounded-lg text-white hover:bg-white/10 transition-colors">預約</a>
      <a href="/events/{{ ep.slug }}/orders"     class="px-3 py-1.5 text-sm font-medium rounded-lg text-white hover:bg-white/10 transition-colors">查詢訂單</a>
      <a href="/events/{{ ep.slug }}/remittance" class="px-3 py-1.5 text-sm font-medium rounded-lg text-white hover:bg-white/10 transition-colors">匯款回報</a>
      <a href="/events/{{ ep.slug }}/news"       class="px-3 py-1.5 text-sm font-medium rounded-lg text-white hover:bg-white/10 transition-colors">最新公告</a>
    </div>
    <button data-collapse-toggle="faq-mobile-menu" type="button"
            class="md:hidden p-2 rounded-lg text-white hover:bg-white/10 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>
  <div id="faq-mobile-menu" class="hidden md:hidden ev-mobile-panel">
    <div class="px-4 py-3 space-y-1">
      <a href="/events/{{ ep.slug }}/booking"    class="block px-3 py-2 text-sm font-medium rounded-lg text-white hover:bg-white/10">預約</a>
      <a href="/events/{{ ep.slug }}/orders"     class="block px-3 py-2 text-sm font-medium rounded-lg text-white hover:bg-white/10">查詢訂單</a>
      <a href="/events/{{ ep.slug }}/remittance" class="block px-3 py-2 text-sm font-medium rounded-lg text-white hover:bg-white/10">匯款回報</a>
      <a href="/events/{{ ep.slug }}/news"       class="block px-3 py-2 text-sm font-medium rounded-lg text-white hover:bg-white/10">最新公告</a>
    </div>
  </div>
</nav>

<div class="page-content">
  <a href="/events/{{ ep.slug }}" class="page-back">← 返回活動頁</a>
  <h1 class="page-title">常見問題</h1>
  <p class="page-subtitle">{{ ep.title }} FAQ</p>

  {% if faqs %}
    {% for faq in faqs %}
    <div class="faq-item" id="faq-{{ faq.id }}">
      <button class="faq-question" onclick="toggleFaq(this)">
        <span class="faq-q-text">{{ faq.question }}</span>
        <svg class="faq-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      <div class="faq-answer">
        <div class="faq-answer-inner">{{ faq.answer }}</div>
      </div>
    </div>
    {% endfor %}
  {% else %}
    <div class="empty-state">尚未建立常見問題</div>
  {% endif %}
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
<script>
function toggleFaq(btn) {
  const item = btn.closest('.faq-item');
  item.classList.toggle('open');
}
</script>
</body>
</html>
